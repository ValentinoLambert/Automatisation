services:
  php:
    build: './docker/php'
    user: ${UID:-1000}:${GID:-1000}
    ports:
      - ${PHP_PORT:-8080}:80
    volumes:
      - ./:/var/www/html
    command: bash -c "composer update && php -S 0.0.0.0:80 -t ."
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: racoin
      MYSQL_USER: racoin
      MYSQL_PASSWORD: racoin
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./sql/create_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/import_data.sql:/docker-entrypoint-initdb.d/02_data.sql